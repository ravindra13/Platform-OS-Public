<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform OS | AI Module Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden bg-slate-50 selection:bg-indigo-100 selection:text-indigo-900">

<!-- Reused Header from index.html for UI Consistency -->
<header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center z-40 shrink-0">
    <div class="flex items-center gap-3 w-64 cursor-pointer hover:opacity-80 transition-opacity" onclick="window.location.href='index.html'" title="Return to Home">
        <div class="w-8 h-8 bg-gradient-to-br from-indigo-600 to-violet-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-indigo-500/30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-500 tracking-tight">Platform OS <span class="text-indigo-500 font-black">Builder</span></h1>
    </div>

    <!-- Elevated Session Context -->
    <div class="flex gap-4 text-sm items-center bg-white shadow-sm px-4 py-2 rounded-full border border-slate-200/60 justify-end">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-slate-500 hidden lg:inline">Tenant: <strong class="text-slate-800" id="currentTenant">TENANT-ACME</strong></span>
        </div>
        <div class="w-px h-4 bg-slate-200 hidden lg:block"></div>
        <div class="flex items-center gap-2">
            <span class="text-slate-500">Admin: <strong class="text-slate-800" id="currentUser">USER-ALICE</strong></span>
        </div>
    </div>
</header>

<!-- Main Split Layout -->
<div class="flex flex-1 overflow-hidden relative bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]">
    
    <!-- Left Panel: AI Control Center -->
    <aside class="w-[400px] bg-white border-r border-slate-200 flex flex-col shrink-0 z-30 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-6 border-b border-slate-100 flex items-center gap-3 bg-gradient-to-b from-indigo-50/50 to-transparent">
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h2 class="font-bold text-slate-800 text-lg">AI Architect</h2>
                <p class="text-xs text-slate-500">Design modules using natural language.</p>
            </div>
        </div>

        <div class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
            <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl text-sm text-blue-800 shadow-sm">
                <strong>Tip:</strong> Be specific. You can ask to create a new module or modify the current draft previewed on the right.
            </div>

            <div class="flex flex-col gap-2 mt-2">
                <label for="module-prompt-input" class="text-xs font-bold uppercase tracking-widest text-slate-400">Your Instructions</label>
                <textarea id="module-prompt-input" rows="6" class="w-full resize-none bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-inner custom-scrollbar transition-all placeholder-slate-400" placeholder="e.g. Build an Equipment Tracking module linked to the User object. Make sure Cost is a required currency field..."></textarea>
            </div>

            <button id="build-module-btn" class="mt-4 w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-indigo-700 transition-all shadow-md shadow-indigo-500/30 flex items-center justify-center gap-2 disabled:bg-slate-400 disabled:cursor-not-allowed disabled:shadow-none">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                Generate / Update Draft
            </button>
        </div>
    </aside>

    <!-- Right Panel: JSON Canvas & Deployment -->
    <main class="flex-1 flex flex-col min-w-0 bg-transparent p-6 relative">
        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 flex flex-col h-full overflow-hidden">
            
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80 backdrop-blur-sm">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-amber-400"></div>
                    <h3 class="font-bold text-slate-700">Blueprint Preview Canvas</h3>
                </div>
                <button id="deploy-btn" disabled class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md shadow-emerald-500/30 hover:bg-emerald-700 transition-all disabled:bg-slate-300 disabled:text-slate-500 disabled:shadow-none disabled:cursor-not-allowed flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Deploy Module
                </button>
            </div>

            <!-- Inject JSON Preview Here -->
            <div id="module-preview-container" class="flex-1 p-6 overflow-y-auto bg-slate-900 custom-scrollbar relative">
                <div class="flex flex-col items-center justify-center h-full text-slate-500">
                    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4M6 16l-4-4"></path></svg>
                    <p>Awaiting AI generation...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Link to External JS Logic -->
<script src="js/module_builder.js"></script>

</body>
</html>
