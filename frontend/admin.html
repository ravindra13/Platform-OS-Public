<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform OS - Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .sidebar-link { transition: all 0.2s ease; border-left: 3px solid transparent; }
        .sidebar-link.active {
            background: linear-gradient(90deg, #e0e7ff 0%, transparent 100%);
            color: #4f46e5;
            font-weight: 600;
            border-left: 3px solid #4f46e5;
        }
        .sidebar-link:hover:not(.active) {
            background-color: #f8fafc;
            transform: translateX(4px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden bg-slate-50 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Modern Dark Header for Admin/System Mode -->
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-700 text-white px-6 py-4 flex justify-between items-center z-50 shrink-0 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-slate-600 to-slate-800 rounded-xl flex items-center justify-center font-bold text-lg shadow-lg border border-slate-600/50">
                <svg class="w-4 h-4 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400 tracking-tight">Platform Setup</h1>
        </div>

        <div class="flex gap-4 text-sm items-center bg-slate-800/50 shadow-inner px-4 py-1.5 rounded-full border border-slate-700/60">
            <span class="text-slate-400 text-xs font-medium">Execution Mode: <strong class="text-emerald-400 tracking-wide ml-1">SYSTEM</strong></span>
            <div class="w-px h-4 bg-slate-600 mx-1"></div>
            <a href="index.html" class="text-xs font-semibold text-indigo-300 hover:text-white transition-colors flex items-center gap-1.5">
                Return to App
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <!-- Setup Navigation Sidebar -->
        <aside class="w-64 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 z-30 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
            <div class="p-5 text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-2">Data Model</div>
            <nav class="flex flex-col mb-4 space-y-0.5 px-2">
                <a href="#" data-view="object-manager" class="sidebar-link active block px-4 py-2 text-sm text-slate-600 rounded-r-lg">Object Manager</a>
            </nav>

            <div class="p-5 text-[11px] font-bold text-slate-400 uppercase tracking-widest">Security</div>
            <nav class="flex flex-col space-y-0.5 px-2">
                <a href="#" data-view="security-matrix" class="sidebar-link block px-4 py-2 text-sm text-slate-600 rounded-r-lg">Profile Permissions</a>
            </nav>
        </aside>

        <!-- Main Configuration Canvas (With Unified Dot Pattern) -->
        <main class="flex-1 overflow-y-auto p-8 bg-white bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]" id="admin-root">
            <!-- Dynamic Content Injected Here -->
        </main>
    </div>

    <script type="module" src="js/admin/main.js"></script>
</body>
</html>
